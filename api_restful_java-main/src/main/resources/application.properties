# esse arquivo configura o spring boot (lido quando a aplicacao sobe)

spring.application.name=MusicApi

# banco H2 EM MEMORIA, fica na RAM e e recriado vazio a cada execucao
spring.datasource.url=jdbc:h2:mem:musicdb
spring.datasource.username=sa
spring.datasource.password=
# console do banco http://localhost:8080/h2-console (so local: o Dockerfile desliga no deploy)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# no Render o HTTPS termina no proxy; isso faz o Tomcat ler os headers de proxy
# para os links HATEOAS e o Swagger usarem https://<app>.onrender.com
server.forward-headers-strategy=native
# o caminho no Render e: cliente -> Cloudflare -> Render -> API. O IP do cliente vem do CF-Connecting-IP,
# que a Cloudflare preenche e sobrescreve (o cliente nao consegue inventar). O X-Forwarded-For nao serve:
# o primeiro IP da lista o cliente pode inventar, e o ultimo e o da Cloudflare, nao o do cliente
server.tomcat.remoteip.remote-ip-header=cf-connecting-ip

# Swagger UI em /swagger-ui.html; os endpoints aparecem ordenados por metodo HTTP
springdoc.swagger-ui.operations-sorter=method

# sem isso o springdoc copiava os erros do ApiExceptionAdvice (400, 404 e 409 genericos) para TODOS os endpoints,
# ate onde eles nunca acontecem (ex.: 409 num GET); assim cada endpoint mostra so os erros documentados nele
springdoc.override-with-generic-response=false

# o Swagger abre na versao mais nova (o seletor "Select a definition" troca para a v1); tem que ser o nome exibido no seletor
springdoc.swagger-ui.urls-primary-name=Music Catalog API v2
# a chave colada no botao Authorize continua la depois de recarregar a pagina
springdoc.swagger-ui.persist-authorization=true

# ---------- configuracoes proprias da API (lidas em config/ApiProperties) ----------

# chave ADMIN: no Render, defina a variavel de ambiente API_ADMIN_KEY;
# sem ela, a API gera uma chave ADMIN nova a cada execucao e mostra no log
api.security.admin-key=${API_ADMIN_KEY:}

# limite de requisicoes por minuto, por IP (sem chave) ou por chave de API
api.rate-limit.anonymous-per-minute=${API_RATE_LIMIT_ANONYMOUS:60}
api.rate-limit.with-key-per-minute=${API_RATE_LIMIT_WITH_KEY:120}

# sites que podem chamar a API pelo navegador (CORS); separe varios com virgula
api.cors.allowed-origins=${API_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://api-spring-boot-emzp.onrender.com}

# por quanto tempo uma X-Idempotency-Key fica guardada
api.idempotency.ttl=24h

# a API sobe com um catalogo de exemplo (config/SampleDataLoader); API_SAMPLE_DATA=false faz ela subir vazia
api.sample-data.enabled=${API_SAMPLE_DATA:true}
