# esse arquivo configura o spring boot (lido quando a aplicacao sobe)

spring.application.name=MusicApi

# banco H2 EM MEMORIA, fica na RAM e e recriado vazio a cada execucao
spring.datasource.url=jdbc:h2:mem:musicdb
spring.datasource.username=sa
spring.datasource.password=
# console do banco http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# no Render o HTTPS termina no proxy; isso faz o spring ler os headers X-Forwarded-*
# para os links HATEOAS e o Swagger usarem https://<app>.onrender.com
server.forward-headers-strategy=framework

# Swagger UI em /swagger-ui.html; os endpoints aparecem ordenados por metodo HTTP
springdoc.swagger-ui.operations-sorter=method

# sem isso o springdoc copiava os erros do ApiExceptionAdvice (400, 404 e 409 genericos) para TODOS os endpoints,
# ate onde eles nunca acontecem (ex.: 409 num GET); assim cada endpoint mostra so os erros documentados nele
springdoc.override-with-generic-response=false
